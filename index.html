<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Physique Mobile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 95%;
            max-width: 600px;
            margin: 10px auto;
            padding: 15px;
            background-color: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        video {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            background-color: #0f3460;
            margin-bottom: 15px;
            transform: scaleX(1);
        }
        canvas {
            display: none; /* Hidden, used for capturing image */
        }
        button {
            background-color: #0f3460;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            background-color: #1a1a2e;
            transform: translateY(-2px);
        }
        .results {
            margin-top: 20px;
            text-align: left;
            padding: 10px;
            background-color: #0f3460;
            border-radius: 8px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .results p {
            margin: 8px 0;
            font-size: 1em;
            line-height: 1.4;
        }
        .results strong {
            color: #e94560;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #e94560;
            font-size: 1.1em;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="cameraFeed" autoplay playsinline></video>
        <canvas id="captureCanvas"></canvas>
        <button id="captureButton">Analyser l'objet</button>
        <div id="loadingIndicator" class="loading">Analyse en cours...</div>
        <div id="errorMessage" class="error"></div>
        <div id="results" class="results">
            <p><strong>Masse estimée:</strong> <span id="estimatedMass">N/A</span></p>
            <p><strong>Gravité (g):</strong> <span id="gravityValue">N/A</span></p>
            <p><strong>Poids (P = m * g):</strong> <span id="weightValue">N/A</span></p>
            <p><strong>Énergie potentielle (chute de 1m):</strong> <span id="potentialEnergy">N/A</span></p>
            <p><strong>Énergie cinétique (v=1m/s):</strong> <span id="kineticEnergy">N/A</span></p>
            <p><strong>Quantité de mouvement (v=1m/s):</strong> <span id="momentumValue">N/A</span></p>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyDD1yMYKRuJfNAy-PQWOQqKKTjQ-TKpEzI";
        const GEMINI_MODELS = ["gemini-2.5-flash", "gemini-robotics-er-1.6-preview"];
        const API_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/models/";

        const cameraFeed = document.getElementById('cameraFeed');
        const captureCanvas = document.getElementById('captureCanvas');
        const captureButton = document.getElementById('captureButton');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');

        const estimatedMassSpan = document.getElementById('estimatedMass');
        const gravityValueSpan = document.getElementById('gravityValue');
        const weightValueSpan = document.getElementById('weightValue');
        const potentialEnergySpan = document.getElementById('potentialEnergy');
        const kineticEnergySpan = document.getElementById('kineticEnergy');
        const momentumValueSpan = document.getElementById('momentumValue');

        let currentLatitude = null;
        let currentGravity = null;

        // Request camera and geolocation permissions on page load
        document.addEventListener('DOMContentLoaded', () => {
            requestCameraAccess();
            requestGeolocation();
        });

        async function requestCameraAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment' // Prioritize rear camera
                    }
                });
                cameraFeed.srcObject = stream;
                cameraFeed.play();
            } catch (err) {
                errorMessage.textContent = `Erreur d'accès à la caméra: ${err.message}. Veuillez autoriser l'accès.`;
                console.error("Erreur d'accès à la caméra:", err);
            }
        }

        function requestGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLatitude = position.coords.latitude;
                        currentGravity = calculateGravity(currentLatitude);
                        gravityValueSpan.textContent = `${currentGravity.toFixed(4)} m/s²`;
                    },
                    (error) => {
                        errorMessage.textContent = `Erreur de géolocalisation: ${error.message}. Utilisation de g=9.81 m/s².`;
                        console.error("Erreur de géolocalisation:", error);
                        currentGravity = 9.81; // Fallback to standard gravity
                        gravityValueSpan.textContent = `${currentGravity.toFixed(4)} m/s² (par défaut)`;
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
            } else {
                errorMessage.textContent = "La géolocalisation n'est pas supportée par ce navigateur. Utilisation de g=9.81 m/s².";
                currentGravity = 9.81; // Fallback to standard gravity
                gravityValueSpan.textContent = `${currentGravity.toFixed(4)} m/s² (par défaut)`;
            }
        }

        // Simplified formula for gravity based on latitude (WGS84 ellipsoid approximation)
        function calculateGravity(latitude) {
            const latRad = latitude * Math.PI / 180;
            const g0 = 9.780327; // Gravity at equator
            const g45 = 9.80665; // Standard gravity at 45 degrees latitude
            const k = 0.0053024; // Constant
            const k2 = 0.0000058; // Constant

            // International Gravity Formula (1980) approximation
            return g0 * (1 + k * Math.sin(latRad) ** 2 - k2 * Math.sin(2 * latRad) ** 2);
        }

        captureButton.addEventListener('click', async () => {
            errorMessage.textContent = '';
            loadingIndicator.style.display = 'block';
            captureButton.disabled = true;

            const context = captureCanvas.getContext('2d');
            captureCanvas.width = cameraFeed.videoWidth;
            captureCanvas.height = cameraFeed.videoHeight;
            context.drawImage(cameraFeed, 0, 0, captureCanvas.width, captureCanvas.height);

            const imageData = captureCanvas.toDataURL('image/jpeg', 0.8); // Get base64 image
            const base64Data = imageData.split(',')[1]; // Remove "data:image/jpeg;base64," prefix

            let estimatedMass = null;
            for (const modelName of GEMINI_MODELS) {
                try {
                    estimatedMass = await sendToGemini(modelName, base64Data);
                    if (estimatedMass !== null) {
                        break; // Success, exit loop
                    }
                } catch (error) {
                    console.warn(`Erreur avec le modèle ${modelName}:`, error);
                    errorMessage.textContent = `Tentative avec ${modelName} échouée.`;
                }
            }

            if (estimatedMass !== null) {
                displayPhysicsResults(estimatedMass, currentGravity);
            } else {
                errorMessage.textContent = "Impossible d'estimer la masse avec les modèles Gemini. Veuillez réessayer.";
                estimatedMassSpan.textContent = "N/A";
                weightValueSpan.textContent = "N/A";
                potentialEnergySpan.textContent = "N/A";
                kineticEnergySpan.textContent = "N/A";
                momentumValueSpan.textContent = "N/A";
            }

            loadingIndicator.style.display = 'none';
            captureButton.disabled = false;
        });

        async function sendToGemini(modelName, base64Data) {
            const prompt = `Analyse attentivement l'image pour identifier l'objet principal au centre de l'attention. 
            Étape 1 : Évalue les dimensions de l'objet en utilisant les éléments de contexte visibles pour l'échelle (mains, meubles, environnement).
            Étape 2 : Identifie les matériaux probables qui le composent (métal, plastique, verre, bois, tissu, etc.) pour en déduire sa densité volumique.
            Étape 3 : Calcule une estimation précise de sa masse réelle en kilogrammes en combinant le volume estimé et la densité.
            
            RÈGLE ABSOLUE : Ta réponse finale doit être STRICTEMENT ET UNIQUEMENT la valeur numérique de la masse suivie de "kg" (par exemple : "0.25 kg", "1.5 kg", "70 kg"). 
            Ne donne AUCUNE explication, AUCUNE phrase d'introduction, et AUCUNE fourchette de valeurs. Si tu as un doute, fournis ta meilleure estimation mathématique ponctuelle.`;

            const requestBody = {
                contents: [{
                    parts: [{
                        text: prompt
                    }, {
                        inlineData: {
                            mimeType: 'image/jpeg',
                            data: base64Data
                        }
                    }]
                }]
            };

            const url = `${API_BASE_URL}${modelName}:generateContent?key=${API_KEY}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`Erreur API Gemini (${modelName}): ${response.status} - ${errorData.error?.message || 'Erreur inconnue'}`);
            }

            const data = await response.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (textResponse) {
                const massMatch = textResponse.match(/(\d+(\.\d+)?)\s*kg/i);
                if (massMatch && massMatch[1]) {
                    return parseFloat(massMatch[1]);
                }
            }
            return null; // Could not parse mass
        }

        function displayPhysicsResults(mass, g) {
            estimatedMassSpan.textContent = `${mass.toFixed(2)} kg`;

            if (g !== null) {
                const weight = mass * g;
                const potentialEnergy = mass * g * 1; // For 1 meter drop
                const assumedVelocity = 1; // m/s for kinetic energy and momentum
                const kineticEnergy = 0.5 * mass * assumedVelocity * assumedVelocity;
                const momentum = mass * assumedVelocity;

                weightValueSpan.textContent = `${weight.toFixed(2)} N`;
                potentialEnergySpan.textContent = `${potentialEnergy.toFixed(2)} J`;
                kineticEnergySpan.textContent = `${kineticEnergy.toFixed(2)} J (pour v=1m/s)`;
                momentumValueSpan.textContent = `${momentum.toFixed(2)} kg·m/s (pour v=1m/s)`;
            } else {
                weightValueSpan.textContent = "N/A (gravité inconnue)";
                potentialEnergySpan.textContent = "N/A (gravité inconnue)";
                kineticEnergySpan.textContent = "N/A";
                momentumValueSpan.textContent = "N/A";
            }
        }
    </script>
</body>
</html>
